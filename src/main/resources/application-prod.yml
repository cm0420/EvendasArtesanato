spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    root: warn

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  payment:
    provider: fake  # trocar quando houver gateway real (só existe FakePaymentGateway)
  shipping:
    provider: fake  # trocar quando houver integração real (só existe FakeShippingProvider)

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

server:
  error:
    include-stacktrace: never
    include-message: never
