spring:
  datasource:
    # DB_URL_SUFFIX fica vazio por padrão (não muda nada). No Neon, setar
    # DB_URL_SUFFIX=?sslmode=require (o Neon exige SSL).
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}${DB_URL_SUFFIX:}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    root: warn

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  payment:
    provider: fake  # trocar quando houver gateway real (só existe FakePaymentGateway)
  shipping:
    provider: fake  # trocar quando houver integração real (só existe FakeShippingProvider)
  # Seeder idempotente no startup (só prod): admin a partir das variáveis e catálogo
  # de exemplo se estiver vazio. Ligado só aqui — não roda em dev nem nos testes.
  seed:
    enabled: true
    admin-email: ${ADMIN_EMAIL:admin@jequi.com.br}
    admin-password: ${ADMIN_PASSWORD:}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

server:
  # A hospedagem (Render) injeta a porta em $PORT; cai pra SERVER_PORT/8080 fora dela.
  port: ${PORT:${SERVER_PORT:8080}}
  # IP real do cliente a partir do X-Forwarded-For do load balancer da hospedagem
  # (o limite de login/cadastro é por IP; sem isso todo mundo teria o IP do balanceador)
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never
