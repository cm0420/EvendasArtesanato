# Blueprint da Render: backend Spring Boot (Docker) + PostgreSQL grátis.
# Na Render: New > Blueprint > conecta este repo. Ela lê este arquivo e cria os dois.
services:
  - type: web
    name: jequi-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true          # a Render gera um segredo forte e guarda
      # Banco no Neon (não expira). Setar os valores na Render (Environment):
      #   DB_HOST=ep-...-pooler....neon.tech  DB_PORT=5432  DB_NAME=neondb
      #   DB_USERNAME=neondb_owner  DB_PASSWORD=<senha do Neon>  DB_URL_SUFFIX=?sslmode=require
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_URL_SUFFIX
        sync: false
      # Domínio do front na Vercel. Com o proxy do vercel.json as chamadas são
      # same-origin (CORS nem dispara), mas deixamos configurável. Preencher depois.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Admin semeado no startup. Defina os dois na Render (Environment) para o
      # seeder criar o admin; sem ADMIN_PASSWORD ele não cria admin (só avisa).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

# Banco agora é externo (Neon, não expira). Sem bloco `databases` aqui — os DB_*
# acima são preenchidos à mão na Render com os dados do Neon.
