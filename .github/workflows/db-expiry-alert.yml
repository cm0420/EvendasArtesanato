name: Aviso de expiração do banco (Render free)

# Avisa no WhatsApp quando o banco free da Render estiver perto de expirar (~30 dias
# desde a criação). Nada de ping/keep-alive: o app só fica lento (cold start), não perde
# dado; o que expira por idade é o banco.
#
# Configurar (uma vez), em Settings do repositório:
#   Variables  -> EXPIRY_DATE   = data de expiração que a Render mostra na página do banco (YYYY-MM-DD)
#   Variables  -> WARN_DAYS     = (opcional) com quantos dias de antecedência avisar (padrão 7)
#   Secrets    -> NTFY_TOPIC    = nome do tópico ntfy (funciona como senha; use um aleatório)
#
# ntfy (grátis, sem cadastro): instale o app "ntfy" no celular e "subscribe" no mesmo
# tópico (ex.: jequi-db-pgm2h138shfzxlct). O alerta chega como push. https://ntfy.sh

on:
  schedule:
    - cron: '0 12 * * *'   # todo dia 12:00 UTC (~09:00 BRT)
  workflow_dispatch:        # permite rodar na mão pra testar

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checar dias restantes e avisar
        env:
          EXPIRY_DATE: ${{ vars.EXPIRY_DATE }}
          WARN_DAYS: ${{ vars.WARN_DAYS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -euo pipefail

          if [ -z "${EXPIRY_DATE:-}" ]; then
            echo "EXPIRY_DATE não configurado (Settings > Variables). Pulando."
            exit 0
          fi
          WARN="${WARN_DAYS:-7}"

          expiry_ts=$(date -u -d "$EXPIRY_DATE" +%s)
          today_ts=$(date -u -d "$(date -u +%F)" +%s)
          days_left=$(( (expiry_ts - today_ts) / 86400 ))
          echo "Expira em $EXPIRY_DATE — faltam $days_left dia(s). Avisa quando <= $WARN."

          if [ "$days_left" -gt "$WARN" ]; then
            echo "Ainda longe. Sem aviso."
            exit 0
          fi

          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "::warning::Banco expira em $days_left dia(s), mas NTFY_TOPIC não está configurado."
            exit 0
          fi

          if [ "$days_left" -lt 0 ]; then
            MSG="O banco da Render JA EXPIROU (em $EXPIRY_DATE). Recrie/migre o banco."
          else
            MSG="O banco free da Render expira em $days_left dia(s) ($EXPIRY_DATE). Recrie/migre antes de perder os dados."
          fi

          # envia push pelo ntfy
          code=$(curl -s "https://ntfy.sh/${NTFY_TOPIC}" \
            -H "Title: Jequi - banco Render" \
            -H "Priority: high" \
            -H "Tags: warning" \
            -d "$MSG" \
            -o /tmp/ntfy.out -w "%{http_code}")
          echo "ntfy HTTP $code"
          head -c 400 /tmp/ntfy.out || true
          [ "$code" = "200" ]
